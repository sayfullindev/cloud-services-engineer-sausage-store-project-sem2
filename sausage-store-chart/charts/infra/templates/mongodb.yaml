---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongodb.name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "{{ .Values.mongodb.name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sausage-store
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.env.user | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.env.password | quote }}
  MONGO_REPORT_DATABASE: {{ .Values.mongodb.report.database | quote }}
  MONGO_REPORT_USERNAME: {{ .Values.mongodb.report.user | quote }}
  MONGO_REPORT_PASSWORD: {{ .Values.mongodb.report.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "{{ .Values.mongodb.name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sausage-store
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.mongodb.containerPort }}
      targetPort: {{ .Values.mongodb.containerPort }}
      protocol: TCP
  selector:
    app: "{{ .Values.mongodb.name }}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mongodb.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: "{{ .Values.mongodb.name }}"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sausage-store
spec:
  serviceName: {{ .Values.mongodb.name }}
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Values.mongodb.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.mongodb.name }}"
    spec:
      containers:
        - name: {{ .Values.mongodb.name }}
          image: {{ .Values.mongodb.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --wiredTigerCacheSizeGB
            - {{ .Values.mongodb.wiredTigerCacheSizeGB | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.mongodb.name }}-secret
          ports:
            - name: mongodb
              containerPort: {{ .Values.mongodb.containerPort }}
          resources:
{{ toYaml .Values.mongodb.resources | indent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mongodb.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: {{ .Values.mongodb.name }}-data
              mountPath: {{ .Values.mongodb.storage.mountPath }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.mongodb.name }}-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mongodb.storage.size }}
