global:
  imagePullPolicy: Always
  ###vault:
  ###  host: ip
  ###  name: vault
  ###  vaultToken: someToken


frontend:
### В чарте frontend отсутствуют некоторые важные файлы. Поймите какие и опишите их.
  replicas: 1
  revisionHistoryLimit: 15
  strategy:
    type: Recreate
  service:
    port: 80
  ingress:
    host: YOUR_STUDENT_HOSTNAME.students-projects.ru # Корректный домен будет указан в задании
    path: /
    pathType: Prefix
  containerPort: 80
  image: YOUR_DOCKERHUB/sausage-frontend:latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "1"
  nginxConf: nginx.conf

backend:
  annotations:
    path: /actuator/prometheus
    port: "8080"
    scrape: "true"
  env:
    postgresUri: jdbc:postgresql://postgresql:5432/sausage-store
    reportPath: /logs/reports
    logPath: /logs
  secrets:
    postgresUser: store
    postgresPassword: storepassword
    mongoUri: mongodb://reports:reportspassword@mongodb:27017/sausage-store
  service:
    port: 8080
  revisionHistoryLimit: 15
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image: gabella187/sausage-backend:latest
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"
  containerPort: 8080
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  vpa:
    updatePolicy:
      updateMode: "Off"
    resourcePolicy:
      containerPolicies:
        - containerName: backend
          controlledResources: ["cpu", "memory"]

backend-report:
  env:
    appPort: 8080
  secrets:
    mongoUri: mongodb://reports:reportspassword@mongodb:27017/sausage-store
  revisionHistoryLimit: 15
  replicas: 1
  strategy:
    type: Recreate
  image: gabella187/sausage-backend-report:latest
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  containerPort: 8080
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  hpa:
    minReplicas: 1
    maxReplicas: 5
    averageUtilization: 75

infra:
  postgresql:
    name: postgresql
    image: postgres:16-alpine
    containerPort: 5432
    env:
      database: sausage-store
      user: store
      password: storepassword
      pgData: /var/lib/postgresql/data/pgdata
    storage:
      mountPath: /var/lib/postgresql/data
      size: 1Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
  mongodb:
    name: mongodb
    image: mongo:7.0
    containerPort: 27017
    env:
      user: root
      password: rootpassword
    report:
      database: sausage-store
      user: reports
      password: reportspassword
    initResources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    wiredTigerCacheSizeGB: 0.25
    storage:
      mountPath: /data/db
      size: 1Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
